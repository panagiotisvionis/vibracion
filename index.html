  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #fdfaf6;

      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', serif; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #fdfaf6; }
    ::-webkit-scrollbar-thumb { background: #5a6e5a; border-radius: 4px; }
    ::selection { background: rgba(90,110,90,0.15); }

    /* ── Scroll progress ── */
    #scroll-progress {
      position: fixed; top: 0; left: 0; height: 2px; width: 0%;
      background: linear-gradient(90deg, #5a6e5a, #c9a055);
      z-index: 9999; transition: width 0.08s linear;
    }

    /* ── Brand utilities ── */
    .text-serene-green  { color: #5a6e5a; }
    .bg-serene-green    { background-color: #5a6e5a; }
    .border-serene-green{ border-color: #5a6e5a; }
    .text-serene-gold   { color: #c9a055; }
    .bg-serene-gold     { background-color: #c9a055; }
    .bg-serene-beige    { background-color: #fdfaf6; }
    .bg-serene-cream    { background-color: #f5ede0; }
    .text-serene-cream  { color: #f5ede0; }

    /* ── Glass morphism ── */
    .glass {
      background: rgba(253,250,246,0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .glass-dark {
      background: rgba(20,17,14,0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* ── Gradient text ── */
    .gradient-text {
      background: linear-gradient(135deg, #5a6e5a 0%, #c9a055 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Sound wave bars ── */
    .sound-bar {
      display: inline-block;
      width: 3px;
      border-radius: 2px;
      transform-origin: bottom center;
      animation: soundWave 1.2s ease-in-out infinite;
    }
    @keyframes soundWave {
      0%, 100% { transform: scaleY(0.3); opacity: 0.5; }
      50%       { transform: scaleY(1);   opacity: 1;   }
    }

    /* ── Hero animations ── */
    .hero-title {
      animation: heroBlur 1.6s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .hero-sub  { animation: heroBlur 1.6s cubic-bezier(0.16,1,0.3,1) 0.25s both; }
    .hero-cta  { animation: heroBlur 1.6s cubic-bezier(0.16,1,0.3,1) 0.5s  both; }
    @keyframes heroBlur {
      from { opacity:0; transform:translateY(28px); filter:blur(12px); }
      to   { opacity:1; transform:translateY(0);    filter:blur(0);    }
    }

    /* ── Scroll reveal ── */
    .reveal        { opacity:0; transform:translateY(50px);  transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1); }
    .reveal-left   { opacity:0; transform:translateX(-50px); transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1); }
    .reveal-right  { opacity:0; transform:translateX(50px);  transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1); }
    .reveal-scale  { opacity:0; transform:scale(0.88);       transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1); }
    .reveal.visible, .reveal-left.visible, .reveal-right.visible, .reveal-scale.visible {
      opacity:1; transform:none;
    }

    /* ── Delay helpers ── */
    .d-0   { transition-delay:0ms;   }
    .d-100 { transition-delay:100ms; }
    .d-200 { transition-delay:200ms; }
    .d-300 { transition-delay:300ms; }
    .d-400 { transition-delay:400ms; }
    .d-500 { transition-delay:500ms; }
    .d-600 { transition-delay:600ms; }

    /* ── Float ── */
    .float { animation: float 5s ease-in-out infinite; }
    @keyframes float {

    .img-zoom { overflow: hidden; }

  <script>
    // Scroll progress
    window.addEventListener('scroll', () => {
      const el = document.getElementById('scroll-progress');
      if (el) {
        const pct = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight) * 100;
        el.style.width = pct + '%';
      }
    }, { passive: true });
  </script>
