<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibración — Sound Healing & Therapies · Καλαμάτα</title>
  <meta name="description" content="Ηχοθεραπεία, Ηχομασάζ και θεραπευτικές συνεδρίες με την Ελένη Χρηστίδου στην Καλαμάτα. Sound Healing & Therapies in Kalamata, Greece." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'serene-green':  '#5a6e5a',
            'serene-dark':   '#3d4f3d',
            'serene-beige':  '#fdfaf6',
            'serene-cream':  '#f5ede0',
            'serene-gold':   '#c9a055',
            'serene-warm':   '#b5805a',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans:  ['Quicksand', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #fdfaf6;
      color: #2a2520;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', serif; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #fdfaf6; }
    ::-webkit-scrollbar-thumb { background: #5a6e5a; border-radius: 4px; }
    ::selection { background: rgba(90,110,90,0.15); }

    /* ── Scroll progress ── */
    #scroll-progress {
      position: fixed; top: 0; left: 0; height: 2px; width: 0%;
      background: linear-gradient(90deg, #5a6e5a, #c9a055);
      z-index: 9999; transition: width 0.08s linear;
    }

    /* ── Brand utilities ── */
    .text-serene-green  { color: #5a6e5a; }
    .bg-serene-green    { background-color: #5a6e5a; }
    .border-serene-green{ border-color: #5a6e5a; }
    .text-serene-gold   { color: #c9a055; }
    .bg-serene-gold     { background-color: #c9a055; }
    .bg-serene-beige    { background-color: #fdfaf6; }
    .bg-serene-cream    { background-color: #f5ede0; }
    .text-serene-cream  { color: #f5ede0; }

    /* ── Glass morphism ── */
    .glass {
      background: rgba(253,250,246,0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .glass-dark {
      background: rgba(20,17,14,0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* ── Gradient text ── */
    .gradient-text {
      background: linear-gradient(135deg, #5a6e5a 0%, #c9a055 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Sound wave bars ── */
    .sound-bar {
      display: inline-block;
      width: 3px;
      border-radius: 2px;
      transform-origin: bottom center;
      animation: soundWave 1.2s ease-in-out infinite;
    }
    @keyframes soundWave {
      0%, 100% { transform: scaleY(0.3); opacity: 0.5; }
      50%       { transform: scaleY(1);   opacity: 1;   }
    }

    /* ── Hero animations ── */
    .hero-title {
      animation: heroBlur 1.6s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .hero-sub  { animation: heroBlur 1.6s cubic-bezier(0.16,1,0.3,1) 0.25s both; }
    .hero-cta  { animation: heroBlur 1.6s cubic-bezier(0.16,1,0.3,1) 0.5s  both; }
    @keyframes heroBlur {
      from { opacity:0; transform:translateY(28px); filter:blur(12px); }
      to   { opacity:1; transform:translateY(0);    filter:blur(0);    }
    }

    /* ── Scroll reveal ── */
    .reveal        { opacity:0; transform:translateY(50px);  transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1); }
    .reveal-left   { opacity:0; transform:translateX(-50px); transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1); }
    .reveal-right  { opacity:0; transform:translateX(50px);  transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1); }
    .reveal-scale  { opacity:0; transform:scale(0.88);       transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1); }
    .reveal.visible, .reveal-left.visible, .reveal-right.visible, .reveal-scale.visible {
      opacity:1; transform:none;
    }

    /* ── Delay helpers ── */
    .d-0   { transition-delay:0ms;   }
    .d-100 { transition-delay:100ms; }
    .d-200 { transition-delay:200ms; }
    .d-300 { transition-delay:300ms; }
    .d-400 { transition-delay:400ms; }
    .d-500 { transition-delay:500ms; }
    .d-600 { transition-delay:600ms; }

    /* ── Float ── */
    .float { animation: float 5s ease-in-out infinite; }
    @keyframes float {
      0%,100% { transform:translateY(0); }
      50%     { transform:translateY(-14px); }
    }

    /* ── Shimmer decorative line ── */
    .shimmer-line {
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, #c9a055 50%, transparent 100%);
      background-size: 200% 100%;
      animation: shimmer 3s infinite;
    }
    @keyframes shimmer {
      0%   { background-position:-200% 0; }
      100% { background-position: 200% 0; }
    }

    /* ── Image zoom ── */
    .img-zoom { overflow: hidden; }
    .img-zoom img { transition: transform .8s cubic-bezier(.16,1,.3,1); }
    .img-zoom:hover img { transform: scale(1.07); }

    /* ── Pulse ring ── */
    .pulse-ring::before {
      content:''; position:absolute; inset:-8px;
      border-radius:inherit; border:1px solid rgba(90,110,90,.3);
      animation: pulse 2.5s ease-out infinite;
    }
    @keyframes pulse {
      0%   { transform:scale(1);   opacity:.7; }
      100% { transform:scale(1.1); opacity:0;  }
    }

    /* ── Mobile menu ── */
    .mobile-menu {
      transition: opacity .4s ease, transform .4s cubic-bezier(.16,1,.3,1);
    }
    .mobile-menu.closed { opacity:0; transform:translateY(-20px); pointer-events:none; }
    .mobile-menu.open   { opacity:1; transform:translateY(0);     pointer-events:auto; }

    /* ── Section wave divider ── */
    .wave-top::before {
      content:''; display:block; height:60px;
      background: inherit;
      clip-path: ellipse(55% 100% at 50% 0%);
      margin-top:-59px;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>

</head>
<body>
  <div id="scroll-progress"></div>
  <div id="root"></div>
  <script>
    // Scroll progress
    window.addEventListener('scroll', () => {
      const el = document.getElementById('scroll-progress');
      if (el) {
        const pct = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight) * 100;
        el.style.width = pct + '%';
      }
    }, { passive: true });
  </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
